<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GLITCH - NEXUS Network Maze</title>
    <link rel="stylesheet" href="../CSS/maze.css" />
  </head>
  <body>
    <div id="app">
      <h1>NEXUS // NETWORK</h1>
      <div>
        Find the path from START to EXIT by clicking on neighboring squares.
      </div>
      <div class="hud">
        <span>TIME: <b id="time">60</b>s</span>
        <span>SUSPICION: <b id="suspicion">0</b>/100</span>
      </div>
      <div id="story"></div>
      <div id="grid"></div>
      <div id="msg"></div>
      <div style="text-align: center; margin-top: 8px">
        <button id="startAgain" hidden>Start Again</button>
      </div>
      <div id="log"></div>
    </div>

    <div id="endingPopup" hidden>
      <div class="ending-box">
        <h2>SYSTEM OVERRIDE COMPLETE</h2>
        <h1>YOU ESCAPED THE SIMULATION</h1>

        <p>NEXUS has lost control.</p>
        <p>You broke the code, uncovered the truth, and found your way out.</p>

        <h3>FREEDOM RESTORED.</h3>

        <button onclick="playAgain()">PLAY AGAIN</button>
      </div>
    </div>

    <script src="../JavaScript/maze.js"></script>
  </body>
</html>
